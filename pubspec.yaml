name: interviewer
description: "采访端 - 一键切换采访状态"
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.2
  # http 用于运行期读取同目录的 config.json（见 lib/main.dart 的 loadRuntimeConfig）
  http: ^1.3.0
# shared_preferences 已移除：代码里从未 import 过它，采访端的服务器地址走
# config.json 运行期覆盖，不需要本地键值存储。留着会拖进
# shared_preferences_android 原生模块，在 Windows 上构建 APK 时会让
# Kotlin 增量缓存崩掉（Could not close incremental caches ... .tab）。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 自带中文子集字体。
  #
  # 不带的话，Flutter Web 会从 fonts.gstatic.com 拉完整的 Noto Sans SC。
  # 校园内网没有外网，于是每次打开都要等这些请求超时——这正是「加载要等
  # 十多秒」的主因，而且超时后汉字根本不显示。
  #
  # 这份子集由 `node make-subset-font.mjs` 从 Noto Sans SC 切出（OFL 1.1，
  # 允许再分发与子集化），只含界面实际用到的 254 个汉字 + ASCII，约 237KB。
  # 改动界面文案后重新跑一次该脚本即可。
  fonts:
    - family: NotoSansSCSubset
      fonts:
        - asset: assets/fonts/NotoSansSC-Subset.ttf
    # Flutter Web 引擎的默认字体族是 Roboto，找不到本地定义时会去
    # fonts.gstatic.com 拉。断网部署时这个请求会一直挂着，是「首屏要等
    # 十多秒」的另一个主因。这里用同一份子集字体顶替 Roboto——子集里已经
    # 包含完整 ASCII，界面上的数字与拉丁字符都能正常显示——从而彻底不依赖 CDN。
    - family: Roboto
      fonts:
        - asset: assets/fonts/NotoSansSC-Subset.ttf
